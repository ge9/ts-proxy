name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: ${{ github.event.release.tag_name || format('dev-{0}', github.run_number) }}

jobs:
  build-pc:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: add Go path (https://github.com/actions/runner-images/issues/13675)
        if: runner.os == 'macOS'
        run: env | grep GOROOT_  | sort | tail -1 | sed 's/.*=//;s|$|/bin|' >> $GITHUB_PATH
      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            export CGO_ENABLED=0
          fi
          make
      - name: Archive (tar.gz)
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            pwsh -Command Compress-Archive -Path ts-proxy.exe -DestinationPath ts-proxy-${{ env.VERSION }}-windows.zip
          else
            tar -cvzf ts-proxy-${{ env.VERSION }}-${{ matrix.os }}.tar.gz ts-proxy
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: |
            *.tar.gz
            *.zip
  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Build for FreeBSD
        run: |
          export GOOS=freebsd
          export GOARCH=amd64
          make
      - name: Archive (tar.gz)
        run: tar -cvzf ts-proxy-${{ env.VERSION }}-freebsd.tar.gz ts-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: binary-freebsd
          path: |
            *.tar.gz
  build-termux:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build in Termux Container
        run: |
          chmod -R 777 ..
          docker run --rm \
            --platform linux/arm64 \
            --privileged \
            -v $PWD/..:/workspace \
            -w /workspace/$(basename $PWD) \
            termux/termux-docker:aarch64 \
            /entrypoint.sh sh -c "
              pkg update && pkg upgrade -y -o Dpkg::Options::=--force-confdef && pkg install -y golang clang make
              CGO_ENABLED=1 make
            "
      - name: Archive (tar.gz)
        run: tar -cvzf ts-proxy-${{ env.VERSION }}-aa64termux.tar.gz ts-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: binary-termux
          path: "*.tar.gz"

  release:
      needs: [build-pc, build-freebsd, build-termux]
      if: github.event_name == 'release'
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - name: Download all artifacts
          uses: actions/download-artifact@v4
          with:
            path: ./artifacts
            pattern: binary-*
            merge-multiple: true
        - name: Create Release
          uses: softprops/action-gh-release@v2
          with:
            files: ./artifacts/*