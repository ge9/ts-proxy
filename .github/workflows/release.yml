name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pc:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: add Go path (https://github.com/actions/runner-images/issues/13675)
        if: runner.os == 'macOS'
        run: env | grep GOROOT_  | sort | tail -1 | sed 's/.*=//;s|$|/bin|' >> $GITHUB_PATH
      - name: Build
        shell: bash
        run: |
          make
      - name: Archive (tar.gz)
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            pwsh -Command Compress-Archive -Path ts-proxy.exe -DestinationPath ts-proxy-${{ github.ref_name }}-windows.zip
          else
            tar -cvzf ts-proxy-${{ github.ref_name }}-${{ matrix.os }}.tar.gz ts-proxy
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: |
            *.tar.gz
            *.zip
  build-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Build for FreeBSD
        run: |
          export GOOS=freebsd
          export GOARCH=amd64
          make
      - name: Archive (tar.gz)
        run: tar -cvzf ts-proxy-${{ github.ref_name }}-freebsd.tar.gz ts-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: binary-freebsd
          path: |
            *.tar.gz
  build-termux:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build in Termux Container
        run: |
          chmod -R 777 ..
          docker run --rm \
            --platform linux/arm64 \
            --privileged \
            -v $PWD/..:/workspace \
            -w /workspace/$(basename $PWD) \
            termux/termux-docker:aarch64 \
            /entrypoint.sh sh -c "
              pkg update && pkg upgrade -y -o Dpkg::Options::=--force-confdef && pkg install -y golang make
              make
            "
      - name: Archive (tar.gz)
        run: tar -cvzf ts-proxy-${{ github.ref_name }}-aa64termux.tar.gz ts-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: binary-termux
          path: "*.tar.gz"

  build-termux-gui:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build in Termux Container
        run: |
          chmod -R 777 ..
          docker run --rm \
            --platform linux/arm64 \
            --privileged \
            -v $PWD/..:/workspace \
            -w /workspace/$(basename $PWD) \
            termux/termux-docker:aarch64 \
            /entrypoint.sh sh -c "
              pkg update && pkg upgrade -y -o Dpkg::Options::=--force-confdef && pkg install -y golang make
              make
            "
      - name: Package GUI release
        run: |
          mkdir -p release/gui
          cp ts-proxy release/ts-proxy
          cp gui/app.py release/gui/
          cp scripts/install.sh release/install.sh
          chmod +x release/install.sh release/ts-proxy

          VERSION=${{ github.ref_name }}
          cd release
          tar czf ../ts-proxy-gui-${VERSION:-manual}-termux.tar.gz .
          cd ..
          ls -lh ts-proxy-gui-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: binary-termux-gui
          path: "ts-proxy-gui-*.tar.gz"

  release:
      needs: [build-pc, build-termux, build-termux-gui]
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - name: Download all artifacts
          uses: actions/download-artifact@v4
          with:
            path: ./artifacts
            pattern: binary-*
            merge-multiple: true
        - name: Create Release
          uses: softprops/action-gh-release@v2
          with:
            files: ./artifacts/*